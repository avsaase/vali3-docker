name: Publish Docker image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: avsaase/vali3

jobs:
  compare:
    uses: ./.github/workflows/compare-with-php.yml

  publish:
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compute image tag
        id: version
        run: |
          SUBMODULE_SHA=$(git -C vali3 rev-parse --short=7 HEAD)
          PROJECT_SHA=$(git rev-parse --short=7 HEAD)
          echo "tag=${SUBMODULE_SHA}-${PROJECT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=vali3-docker
          cache-to: type=gha,mode=max,scope=vali3-docker,ignore-error=true

      - name: Summarize published tags
        run: |
          echo "Published \`${IMAGE_NAME}:${{ steps.version.outputs.tag }}\` and \`${IMAGE_NAME}:latest\`." >> "$GITHUB_STEP_SUMMARY"
